<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Star circle icon">
  <defs>
    <linearGradient id="starGradient" x1="40" y1="28" x2="216" y2="228" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bfefff"/>
      <stop offset="0.52" stop-color="#32b8ff"/>
      <stop offset="1" stop-color="#006dff"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <symbol id="star" viewBox="-14 -14 28 28">
      <path d="M0-13 3.9-4.2 13-3.2 6.2 2.9 8.1 12 0 7.3-8.1 12-6.2 2.9-13-3.2-3.9-4.2Z"/>
    </symbol>
  </defs>

  <g fill="url(#starGradient)" filter="url(#softGlow)">
    <use href="#star" x="128" y="24" width="28" height="28" transform="translate(128 24) rotate(0) translate(-128 -24)"/>
    <use href="#star" x="180" y="38" width="26" height="26" transform="translate(180 38) rotate(30) translate(-180 -38)"/>
    <use href="#star" x="218" y="76" width="28" height="28" transform="translate(218 76) rotate(60) translate(-218 -76)"/>
    <use href="#star" x="232" y="128" width="26" height="26" transform="translate(232 128) rotate(90) translate(-232 -128)"/>
    <use href="#star" x="218" y="180" width="28" height="28" transform="translate(218 180) rotate(120) translate(-218 -180)"/>
    <use href="#star" x="180" y="218" width="26" height="26" transform="translate(180 218) rotate(150) translate(-180 -218)"/>
    <use href="#star" x="128" y="232" width="28" height="28" transform="translate(128 232) rotate(180) translate(-128 -232)"/>
    <use href="#star" x="76" y="218" width="26" height="26" transform="translate(76 218) rotate(210) translate(-76 -218)"/>
    <use href="#star" x="38" y="180" width="28" height="28" transform="translate(38 180) rotate(240) translate(-38 -180)"/>
    <use href="#star" x="24" y="128" width="26" height="26" transform="translate(24 128) rotate(270) translate(-24 -128)"/>
    <use href="#star" x="38" y="76" width="28" height="28" transform="translate(38 76) rotate(300) translate(-38 -76)"/>
    <use href="#star" x="76" y="38" width="26" height="26" transform="translate(76 38) rotate(330) translate(-76 -38)"/>
  </g>
</svg>
